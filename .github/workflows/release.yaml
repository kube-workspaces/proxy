name: Release

# Cut a release: tag the commit, generate notes, publish.
#
# Run from the Actions tab with the version to release. Tagging triggers the
# Docker workflow, which publishes the versioned image.
#
# Release the four component repositories BEFORE kube-workspaces/deploy: the
# chart's appVersion pins these images and must name ones that already exist.
# See https://github.com/kube-workspaces/deploy/blob/main/docs/releasing.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.3.0'
        type: string
        required: true
      dry_run:
        description: 'Print the notes without tagging or publishing'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the notes are generated from the commit range since the
          # previous tag.
          fetch-depth: 0

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a vX.Y.Z version"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      # The generator lives in the deploy repo so all five repositories classify
      # commits the same way.
      - name: Fetch the release-notes generator
        run: |
          curl -fsSLo /tmp/release-notes.sh \
            https://raw.githubusercontent.com/kube-workspaces/deploy/main/scripts/release-notes.sh
          chmod +x /tmp/release-notes.sh

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          # --version, not just --to HEAD: the notes quote the version in the
          # upgrade command, and "HEAD" is not installable.
          /tmp/release-notes.sh \
            --repo "${GITHUB_REPOSITORY##*/}" \
            --from "$(git describe --tags --abbrev=0)" \
            --to HEAD --version "${{ inputs.version }}" > /tmp/preamble.md
          cat /tmp/preamble.md

      - name: Summary
        run: |
          {
            echo "### Release notes preview for ${{ inputs.version }}"
            echo
            cat /tmp/preamble.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the tag and release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

          # --generate-notes appends the categorised commit list, grouped per
          # .github/release.yml, beneath our preamble.
          #
          # Use --notes-file rather than passing the body through a GitHub
          # expression: interpolating it into the shell makes bash treat its
          # backticks as command substitution, which silently ate every code span
          # and the fenced block. (A literal expression cannot appear even in a
          # comment here — Actions evaluates it and fails to parse the file.)
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/preamble.md \
            --generate-notes \
            --verify-tag

      # A tag pushed with GITHUB_TOKEN does not trigger other workflows —
      # GitHub suppresses that to prevent recursion. So the image build has to be
      # dispatched explicitly, or the release would have no versioned image and
      # kube-workspaces/deploy would refuse to release against it.
      - name: Build the release image
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run docker.yml --ref "$VERSION"; then
              echo "::notice::dispatched the image build for $VERSION"
              exit 0
            fi
            echo "dispatch attempt ${attempt}/5 failed; retrying in 5s" >&2
            sleep 5
          done
          echo "::error::could not dispatch docker.yml for $VERSION"
          exit 1

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry run — nothing was tagged or published. Re-run with dry_run=false to release."
